<main><header class="intro"><div><div class="eyebrow">MIDNIGHT LUCKY HOTEL / MOBILE CONSOLE STUDY 01</div><h1>一台机器，一屏操作。</h1><p>方案 A · 固定机台。准备、重转、结算在同一套坐标上切换。</p></div><div class="approval">390 × 760 CSS px · 排版样张，非已实现界面<br>复用现有素材；示例数值不代表本次试玩战绩。</div></header>
<div class="boards" id="boards"></div>
<footer class="footer"><strong>固定盘面 · 五槽混搭常驻 · 右侧拉杆保留 · 下方拇指区不移动</strong><span>长说明 / 日志 / 设置进入抽屉；菜单打开时暂停演出。</span></footer></main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="cherry" viewBox="0 0 64 64"><path class="symbol-ink" d="M31 31C32 18 39 11 48 8M33 30C27 20 22 15 15 13"/><path class="symbol-leaf" d="M44 10C48 4 57 6 58 12C52 15 47 14 44 10Z"/><circle class="symbol-red" cx="22" cy="42" r="11"/><circle class="symbol-red" cx="43" cy="40" r="12"/><path class="symbol-shine" d="M17 37C19 34 22 33 25 34"/></symbol>
<symbol id="lemon" viewBox="0 0 64 64"><path class="symbol-yellow" d="M12 36C16 22 29 13 44 16C51 18 56 24 55 31C53 45 40 54 25 51C18 50 11 43 12 36Z"/><path class="symbol-ink" d="M14 30L8 25M52 38L59 43"/><path class="symbol-shine" d="M22 27C28 21 36 20 42 22"/></symbol>
<symbol id="bell" viewBox="0 0 64 64"><path class="symbol-gold" d="M13 44H51L46 37V27C46 18 40 12 32 12C24 12 18 18 18 27V37L13 44Z"/><path class="symbol-ink" d="M10 45H54M26 49C27 55 37 55 38 49"/><path class="symbol-shine" d="M24 24C25 20 28 18 32 18"/></symbol>
</defs></svg>
<script>
const artPath='../../public/art/installed-parts-v1.png';
let serial=0;
function art(n){const x=n%5*280;const y=n===19?863:0;const h=n===19?240:296;const id='part'+serial++;return '<svg viewBox="'+x+' '+y+' 280 '+h+'" aria-hidden="true"><defs><clipPath id="'+id+'"><rect x="'+x+'" y="'+y+'" width="280" height="'+h+'"/></clipPath></defs><image href="'+artPath+'" width="1402" height="1122" clip-path="url(#'+id+')"/></svg>'}
function parts(state){return '<div class="parts">'+[0,1,2,3,4].map((n)=> n>2?'<div class="part empty"></div>':'<div class="part '+(state===2&&n===0?'active':'')+'"><span class="level">L1</span>'+art(n)+'<strong>'+['陈酿果桶','还愿烛台','减震飞轮'][n]+'</strong><small>'+[state===2?'已兑现':'存酿 2/3','储量 0/3','保护 1'][n]+'</small></div>').join('')+'</div>'}
const data=[
{label:'01 / 准备',phase:'可选服务 · 点完就拉',wallet:'800',goal:'0',payout:'上转 +¥0',action:'拉动一转',sub:'下注 ¥50',note:'<b>准备项压成机械配件键。</b>点餐罩后直接选一列；下注固定时不显示三档表单。',keys:['第1轮','第2轮','第3轮']},
{label:'02 / 选列重转',phase:'第2轮已选 · 尚未消耗',wallet:'750',goal:'0',payout:'结果未结算',action:'重转第2轮',sub:'消耗 1 干预点 · 不再扣钱',note:'<b>列下方是独立实体键。</b>选列看风险，底部确认才扣点；不预知随机结果。',keys:['第1轮','↻ 第2轮','第3轮']},
{label:'03 / 连锁结算',phase:'果桶触发 · 奖金已入账',wallet:'1,395',goal:'645',payout:'本转 +¥645',action:'加速结算',sub:'演出结束后自动回到准备',note:'<b>奖金表与部件在原位置响应。</b>不追加“下一转”确认；回准备后需新的按下动作，防止连点误下注。',keys:['第1轮','第2轮','第3轮']}
];
document.getElementById('boards').innerHTML=data.map((d,i)=>{
const symbols=i===2?[['cherry','lemon','bell'],['bell','lemon','cherry'],['cherry','lemon','bell']]:[['cherry','lemon','bell'],['bell','cherry','lemon'],['cherry','lemon','bell']];
const crown='<div class="crown"><svg viewBox="522 170 492 210" preserveAspectRatio="none"><defs><clipPath id="c'+i+'"><path d="M522 378V358H531V285L550 282L577 302L580 264H599V240H683L711 223H739L740 207L770 188L797 205V230H827L854 240H937V264H960V300L985 283L1001 284V356H1014V378Z"/></clipPath></defs><image href="../../public/art/room-crowns-v1.png" width="1536" height="1024" clip-path="url(#c'+i+')"/></svg><span>MIDNIGHT LUCK</span></div>';
const cols=symbols.map((col,c)=>'<div class="column '+(i===1&&c===1?'selected':'')+'">'+col.map((s,r)=>'<div class="cell '+(i===2&&r===1?'won':'')+'"><svg class="symbol" viewBox="0 0 64 64" aria-hidden="true"><use href="#'+s+'"/></svg></div>').join('')+'<div class="reel-key">'+d.keys[c]+'</div></div>').join('');
const tools=i===0?'<div class="tool">'+art(19)+'<span>点餐<small>¥37.5 · 选一列</small></span></div><div class="tool">'+art(1)+'<span>点烛<small>1 小费 · 存恶兆</small></span></div>':'<div class="action-note"><span class="emblem">'+(i===1?'↻':'✧')+'</span><div>'+(i===1?'只重转第2轮，其他不动<small>当前无基础中奖线 · 重转不保证中奖</small>':'果桶开桶 +¥600<small>柠檬中线 ¥45 → 累计 ¥645 · 账本可回看</small>')+'</div></div>';
return '<section><h2 class="board-note">'+d.label+'<span>'+d.phase+'</span></h2><div class="phone" aria-label="'+d.label+'静态样张"><header class="top"><div class="room-title"><b>景观房</b><small>午夜好运酒店 · '+(i===2?'剩余 2 转':'剩余 3 转')+'</small></div><div class="menu">≡</div></header><div class="hud"><div class="money"><small>余额</small><b>¥'+d.wallet+'</b></div><div class="goal"><b>本房奖金 ¥'+d.goal+' / ¥1200</b><div class="meter" style="--progress:'+(i===2?'54%':'0%')+'"><i></i></div><div class="resource"><span>干预 '+(i===2?'●○':'●●')+'</span><span>小费 3</span><span>恶兆 2</span></div></div></div>'+crown+'<div class="payout"><span>'+d.payout+'</span><span class="ledger">账本 ›</span></div><div class="reelstage"><div class="board">'+cols+'</div><div class="lever"><div class="knob"></div><small>'+(i===0?'下拉':'待机')+'</small></div></div>'+parts(i)+'<div class="tools">'+tools+'</div><div class="dock"><div class="side-key">'+(i===0?'<span>下注</span><strong>¥50</strong>':i===1?'<span>取消</span><span>选列</span>':'<span>查看</span><span>明细</span>')+'</div><div class="main-key"><b>'+d.action+'</b><small>'+d.sub+'</small></div></div><div class="click-overlay" aria-label="仅排版样张，不执行游戏操作"></div></div><p class="caption">'+d.note+'</p></section>'
}).join('');
</script></body></html>
